name: Deploy → jonaspacheco.cloud

on:
  push:
    branches:
      - main
  # Permite disparar o deploy manualmente (gh workflow run deploy.yml),
  # util quando o webhook de push nao cria o run - por exemplo durante
  # throttling de incidente do proprio GitHub Actions.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Deploy via rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          VPS_HOST=$(echo "$VPS_HOST" | tr -d '[:space:]')
          VPS_PORT=$(echo "$VPS_PORT" | tr -d '[:space:]')
          VPS_USER=$(echo "$VPS_USER" | tr -d '[:space:]')
          VPS_PATH=$(echo "$VPS_PATH" | tr -d '[:space:]')
          # Publica SOMENTE os arquivos do site (lista de permissao). Tudo o que
          # nao estiver na lista e removido do webroot (--delete-excluded), para
          # codigo-fonte, scripts e configuracoes do repositorio nunca ficarem
          # acessiveis pela web. .well-known fica para a renovacao do certificado.
          rsync -avz --delete --delete-excluded \
            -e "ssh -i ~/.ssh/deploy_key -p ${VPS_PORT} -o StrictHostKeyChecking=no" \
            --filter='P /.well-known/' \
            --include='/index.html' \
            --include='/privacy-policy.html' --include='/privacy-policy-en.html' \
            --include='/terms-of-service.html' --include='/terms-of-service-en.html' \
            --include='/sitemap.xml' \
            --include='/favicon.svg' \
            --include='/jonas-pacheco-logo.png' --include='/jp-logo.png' \
            --include='/logo-jonas-*.svg' \
            --include='/assets/***' \
            --include='/wrconfeccoes/***' \
            --exclude='*' \
            ./ \
            ${VPS_USER}@${VPS_HOST}:${VPS_PATH}/

      - name: Verificar deploy
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://jonaspacheco.cloud)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Deploy concluído! Site respondendo com HTTP $STATUS"
          else
            echo "⚠️ Site respondeu com HTTP $STATUS"
          fi
